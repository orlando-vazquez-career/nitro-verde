[package]
name = "nv-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Capa HTTP de NitroVerde (axum): fake-Meta, API, SSE, UI embebida. No conoce reqwest."

[dependencies]
nv-engine.workspace = true
nv-core.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# `sync` habilita `tokio_stream::wrappers::BroadcastStream` (SSE §C-5).
tokio-stream = { workspace = true, features = ["sync"] }
# `rt` habilita `tokio_util::sync::CancellationToken` (shutdown ADR #3).
tokio-util = { workspace = true, features = ["rt"] }
# `multipart` habilita el extractor Multipart (T19, adjuntar imagen/PDF).
axum = { workspace = true, features = ["multipart"] }
rust-embed.workspace = true
mime_guess.workspace = true
tracing.workspace = true

[dev-dependencies]
http-body-util.workspace = true
# `util` habilita `ServiceExt::oneshot` (tests de rutas sin levantar red).
tower = { workspace = true, features = ["util"] }
